<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e65278" />
  <title>Alert History — SheShield</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="history">

<div class="app">
  <aside class="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div class="page-title">
        <h1>Alert History</h1>
        <p>Every SOS you've sent, who was alerted and who responded</p>
      </div>
      <div class="top-actions">
        <div class="pill" id="locationPill">📍 Locating…</div>
      </div>
    </div>
    <div class="content">

      <div class="search-box"><input id="historySearch" placeholder="Search by date, contact or status" oninput="renderHistory()" aria-label="Search history"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date &amp; Time</th>
              <th>Location</th>
              <th>Contacts</th>
              <th>Layers</th>
              <th>Responded</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="6" class="muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/app.js"></script>
</body>
</html>
