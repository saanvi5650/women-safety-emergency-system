<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#e65278" />
  <title>Trusted Contacts — SheShield</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="contacts">

<div class="app">
  <aside class="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div class="page-title">
        <h1>Trusted Contacts</h1>
        <p id="contactCount">Manage your emergency network</p>
      </div>
      <div class="top-actions">
        <button class="btn btn-primary" onclick="openContactModal()">+ Add Contact</button>
      </div>
    </div>

    <div class="content">
      <div class="info-banner">
        <strong>How escalation works:</strong> Priority 1 contacts are alerted immediately. If nobody taps
        “I'm responding”, the next priority group is alerted every minute. Add an email so contacts get alerts even without SMS.
      </div>

      <div class="search-box"><input id="contactSearch" placeholder="Search contacts" oninput="renderContacts()" aria-label="Search contacts"></div>

      <section id="contactsContainer" class="contacts-grid"><p class="muted">Loading…</p></section>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="addContactModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="contactModalTitle">
    <div class="modal-head">
      <h2 id="contactModalTitle" class="serif">Add Trusted Contact</h2>
      <button class="icon-btn" onclick="closeModal('addContactModal')" aria-label="Close">✕</button>
    </div>

    <form onsubmit="saveContact(event)" class="form-grid">
      <input type="hidden" id="contactId">
      <div class="form-row">
        <div class="field">
          <label for="contactName">Name</label>
          <input id="contactName" placeholder="Full name" maxlength="80" required>
        </div>

        <div class="field">
          <label for="contactRelationship">Relationship</label>
          <select id="contactRelationship">
            <option>Mother</option>
            <option>Father</option>
            <option>Sister</option>
            <option>Brother</option>
            <option>Partner</option>
            <option>Friend</option>
            <option>Roommate</option>
            <option>Colleague</option>
            <option>Guardian</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="contactPhone">Phone Number</label>
        <input id="contactPhone" type="tel" placeholder="+91 98765 43210" required>
      </div>

      <div class="field">
        <label for="contactEmail">Email <span class="muted">(recommended)</span></label>
        <input id="contactEmail" type="email" placeholder="contact@email.com">
      </div>

      <div class="field">
        <label for="contactPriority">Priority Layer</label>
        <select id="contactPriority">
          <option value="1">Priority 1 · alerted instantly</option>
          <option value="2">Priority 2 · next if nobody responds</option>
          <option value="3">Priority 3 · after that</option>
          <option value="4">Priority 4 · final layer</option>
        </select>
      </div>

      <button class="btn btn-primary btn-block" id="contactSubmit" type="submit">Add Contact</button>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/app.js"></script>
</body>
</html>
